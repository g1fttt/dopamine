[package]
name = "dopamine"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
windows.workspace = true
windows-numerics.workspace = true
serde.workspace = true
strum.workspace = true
log.workspace = true

dopamine-sdk.path = "../dopamine-sdk"

imgui.path = "../imgui"
imgui-dx9-renderer.path = "../imgui-dx9-renderer"
imgui-win32-support.path = "../imgui-win32-support"

educe = { version = "0.6", features = ["Default"] }
enum-map = { version = "2.7", features = ["serde"] }
fastrand = "2.3"
yaml_serde = "0.10"
chrono = "0.4"
