[package]
name = "dopamine"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { workspace = true }
imgui = { workspace = true }
serde = { workspace = true }

dopamine-sdk = { path = "../dopamine-sdk" }
dopamine-utils = { path = "../dopamine-utils" }

imgui-dx9-renderer = { path = "../imgui-dx9-renderer" }
imgui-win32-support = { path = "../imgui-win32-support" }

educe = { version = "0.6.0", features = ["Default"] }
strum = { version = "0.26.3", features = ["derive"] }
enum-map = { version = "2.7.3", features = ["serde"] }
fastrand = "2.1.0"
toml = "0.8.14"
